name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    name: Release notes check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the previous tag and the feat range are visible.
          fetch-depth: 0
      - name: Require release notes covering new feats
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/${RELEASE_TAG}.md"
          if [ ! -s "$NOTES" ] || ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::error::Missing or empty ${NOTES} — write the release notes (features and fixes) before tagging."
            exit 1
          fi
          PREV=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "Release notes OK: ${NOTES} (first tagged release)."
            exit 0
          fi
          UNCOVERED=$(git log "$PREV..HEAD" --no-merges --pretty=%s \
            | grep -E '^feat(\(|:)' \
            | while IFS= read -r subject; do
                words=$(printf '%s\n' "$subject" \
                  | sed -E 's/^feat(\([^)]*\))?:[[:space:]]*//' \
                  | tr '[:upper:]' '[:lower:]' \
                  | tr -c '[:alnum:]' '\n' \
                  | awk 'length($0) >= 4')
                covered=0
                for word in $words; do
                  if grep -qiF -- "$word" "$NOTES"; then covered=1; break; fi
                done
                [ "$covered" -eq 0 ] && printf '%s\n' "$subject"
              done)
          if [ -n "$UNCOVERED" ]; then
            echo "::error::${NOTES} does not cover these feat commits since ${PREV}:"
            printf '%s\n' "$UNCOVERED"
            echo "Write a notes section for each feature before tagging."
            exit 1
          fi
          echo "Release notes OK: ${NOTES} (covers ${PREV}..${GITHUB_SHA})."

  build:
    name: DMG (${{ matrix.arch }})
    needs: preflight
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const pkg = require("./package.json").version; const tauri = require("./src-tauri/tauri.conf.json").version; const metadata = JSON.parse(require("node:child_process").execFileSync("cargo", ["metadata", "--no-deps", "--format-version", "1", "--manifest-path", "src-tauri/Cargo.toml"])); const cargo = metadata.packages.find(p => p.name === "amc").version; if (`v${pkg}` !== process.env.RELEASE_TAG || pkg !== tauri || pkg !== cargo) { console.error(`Version mismatch: tag=${process.env.RELEASE_TAG}, package=${pkg}, tauri=${tauri}, cargo=${cargo}`); process.exit(1); }'
      - run: npm ci
      - name: Build DMG
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/${RELEASE_TAG}.md"
          if [ ! -s "$NOTES" ] || ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::error::Missing or empty ${NOTES}."
            exit 1
          fi
          echo "RELEASE_NOTES=${NOTES}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: dmg
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: AMC ${{ github.ref_name }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: dmg/*.dmg
          fail_on_unmatched_files: true
