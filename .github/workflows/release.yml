name: Release macOS DMG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    name: Release notes check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the previous tag and the feat range are visible.
          fetch-depth: 0
      - name: Require release notes covering new feats
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/${RELEASE_TAG}.md"
          if [ ! -s "$NOTES" ] || ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::error::Missing or empty ${NOTES} — write the release notes (features and fixes) before tagging."
            exit 1
          fi
          PREV=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "Release notes OK: ${NOTES} (first tagged release)."
            exit 0
          fi
          # Sharing words with the notes is not coverage ("codex" contains
          # "code"); each feat commit must carry an explicit hidden comment
          # acknowledging it: <!--feat:<commit-oid>>-->. grep -F keeps the
          # marker a plain argument (case patterns with "<"/">" misparse).
          NOTES_BODY=$(cat "$NOTES")
          MISSING=$(git log "$PREV..HEAD" --no-merges --pretty='%H %s' \
            | grep -E '^[0-9a-f]{40} feat(\(|:)' \
            | while IFS= read -r record; do
                oid=${record%% *}
                if printf '%s\n' "$NOTES_BODY" | grep -qF -- "<!--feat:$oid-->"; then
                  :
                else
                  printf '%s\n' "$record"
                fi
              done)
          if [ -n "$MISSING" ]; then
            echo "::error::${NOTES} does not acknowledge these feat commits since ${PREV}:"
            printf '%s\n' "$MISSING"
            echo "Append the matching hidden comment for each commit, e.g.:"
            git log "$PREV..HEAD" --no-merges --pretty='%H %s' \
              | grep -E '^[0-9a-f]{40} feat(\(|:)' \
              | while IFS= read -r record; do
                  oid=${record%% *}
                  echo "  <!--feat:${oid}-->  # ${record#* }"
                done
            exit 1
          fi
          echo "Release notes OK: ${NOTES} (covers ${PREV}..${GITHUB_SHA})."

  build:
    name: DMG (${{ matrix.arch }})
    needs: preflight
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const pkg = require("./package.json").version; const tauri = require("./src-tauri/tauri.conf.json").version; const metadata = JSON.parse(require("node:child_process").execFileSync("cargo", ["metadata", "--no-deps", "--format-version", "1", "--manifest-path", "src-tauri/Cargo.toml"])); const cargo = metadata.packages.find(p => p.name === "amc").version; if (`v${pkg}` !== process.env.RELEASE_TAG || pkg !== tauri || pkg !== cargo) { console.error(`Version mismatch: tag=${process.env.RELEASE_TAG}, package=${pkg}, tauri=${tauri}, cargo=${cargo}`); process.exit(1); }'
      - run: npm ci
      - name: Build DMG and updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # 仅 --bundles dmg 不会产出更新器归档（bundler 只对含 app 目标的
        # 构建生成 AMC.app.tar.gz），必须带上 app。
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app,dmg
      - name: Rename updater archive per arch
        # 两个架构的归档同名（AMC.app.tar.gz），release job 的
        # merge-multiple 会互相覆盖，先按架构改名；签名只覆盖归档内容，
        # 改名不影响校验。
        run: |
          cd "src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          mv "AMC.app.tar.gz" "AMC_${{ matrix.arch }}.app.tar.gz"
          mv "AMC.app.tar.gz.sig" "AMC_${{ matrix.arch }}.app.tar.gz.sig"
      - name: Collect release assets
        # upload-artifact v4 以多路径的最近公共祖先为根：dmg/ 与 macos/
        # 两个来源会让下载侧多出 bundle/{dmg,macos}/ 两级目录。统一拷进
        # 单目录再以单路径上传，下载 merge-multiple 后即为扁平结构，
        # Compose 与 softprops 都按 dmg/<文件名> 直接取用。
        run: |
          mkdir -p release-assets
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-assets/
          cp "src-tauri/target/${{ matrix.target }}/release/bundle/macos/AMC_${{ matrix.arch }}.app.tar.gz" \
             "src-tauri/target/${{ matrix.target }}/release/bundle/macos/AMC_${{ matrix.arch }}.app.tar.gz.sig" \
             release-assets/
          ls -l release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the feat appendix can span the whole release.
          fetch-depth: 0
      - name: Resolve release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/${RELEASE_TAG}.md"
          if [ ! -s "$NOTES" ] || ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::error::Missing or empty ${NOTES}."
            exit 1
          fi
          echo "RELEASE_NOTES=${NOTES}" >> "$GITHUB_ENV"
      - name: Append the feat commit list
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          BODY="docs/releases/${RELEASE_TAG}.body.md"
          cp "$RELEASE_NOTES" "$BODY"
          PREV=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            FEATS=$(git log "$PREV..HEAD" --no-merges --pretty='%h|%s' \
              | awk -F'|' '$2 ~ /^feat(\(|:)/ {printf "- %s (%s)\n", $2, $1}')
            if [ -n "$FEATS" ]; then
              {
                printf '\n### 功能提交\n\n%s\n' "$FEATS"
              } >> "$BODY"
            fi
          fi
          echo "RELEASE_NOTES=${BODY}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: dmg
          merge-multiple: true
      - name: Compose latest.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        # updater 端点指向 releases/latest/download/latest.json。signature
        # 必须是 .sig 文件内容本身（含 untrusted comment 行）；notes 用
        # 追加过功能提交列表的 body 版本，和应用内更新弹窗同源。
        run: |
          node -e '
          const { readFileSync, writeFileSync } = require("node:fs");
          const tag = process.env.RELEASE_TAG;
          const base = "https://github.com/BenZinaDaze/amc/releases/download/" + tag;
          const platform = (arch) => ({
            signature: readFileSync(`dmg/AMC_${arch}.app.tar.gz.sig`, "utf8").trim(),
            url: `${base}/AMC_${arch}.app.tar.gz`,
          });
          writeFileSync("dmg/latest.json", JSON.stringify({
            version: tag.replace(/^v/, ""),
            notes: readFileSync(process.env.RELEASE_NOTES, "utf8").trim(),
            pub_date: new Date().toISOString(),
            platforms: {
              "darwin-aarch64": platform("aarch64"),
              "darwin-x86_64": platform("x86_64"),
            },
          }, null, 2));
          '
      # 先传全部二进制产物并创建 Release,latest.json 最后单独补传:
      # updater 端点解析 releases/latest/download/latest.json,它一出现
      # 就代表 DMG 与更新器归档都已就绪,不会指到半成品 Release。
      # latest.json 缺失期间 check() 得到 404,应用侧静默忽略。
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: AMC ${{ github.ref_name }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: |
            dmg/*.dmg
            dmg/*.app.tar.gz
            dmg/*.app.tar.gz.sig
          fail_on_unmatched_files: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dmg/latest.json
